<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="rightClick">
    here right click not allowed
  </div>
  <script>
    const right = document.getElementById('rightClick')
    right.addEventListener('contextmenu',(e)=>{
      e.preventDefault()
      alert('right click not allowed')
    })
  </script>
</body>
</html>
